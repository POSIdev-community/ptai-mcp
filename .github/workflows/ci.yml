name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.os }}, Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [18.x, 20.x, 22.x]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify source, tests and package
        run: npm run verify

      - name: Report function and file sizes
        run: npm run quality:report

      - name: Audit installed and bundled runtime dependencies
        run: npm run audit:runtime

      - name: Inspect npm package
        run: npm pack --dry-run

      - name: Smoke test packed artifact
        run: npm run smoke:artifact
